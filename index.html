<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="res/style.css">
  <link rel="icon" href="res/img/icon.png" type="image/png">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/vuex@4"></script>
</head>

<body>
<div id="app">
  <header class="site-header">
    <nav class="main-nav">
      <a class="nav-item" href="index.html">Home</a>
      <a class="nav-item" href="addpost.html">Add Post</a>
    </nav>

    <div class="profile-container">
      <div class="profile-icon" @click="toggleDropdown">
        <img src="res/img/Profile.png" alt="Profile picture">
      </div>

      <div class="dropdown-menu" :class="{ show: dropdownOpen }">
        <div class="dropdown-item">John Doe</div>
        <div class="dropdown-item">john.doe@ut.ee</div>
        <a class="dropdown-item" href="login.html">Logout</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="left-gutter"></section>
    <section class="feed">
      <post-item
        v-for="post in posts"
        :key="post.id"
        :post="post"
      />
    </section>

    <aside class="right-gutter"></aside>
  </main>

  <footer class="site-footer">
    <button class="reset-btn" @click="resetAllLikes">Reset All Likes</button>
    <p class="footer-text">©2025 Group AL</p>
  </footer>
</div>

<script>
const { createApp } = Vue;
const { createStore } = Vuex;

const store = createStore({
  state() {
    return {
      posts: [],
    };
  },

  mutations: {
    setPosts(state, posts) {
      state.posts = posts;
    },
	  likePost(state, postId) {
    const post = state.posts.find(p => p.id === postId);
    if (post) post.likes++;
  },
  resetLikes(state) {
    state.posts.forEach(p => p.likes = 0);
	}
  },

  actions: {
    async fetchPosts({ commit }) {
      const response = await fetch('res/posts.json', { cache: "no-cache" });
      const data = await response.json();
      commit("setPosts", data.posts || []);
    },
	  likePost({ commit }, postId) {
    commit("likePost", postId);
  },
  resetLikes({ commit }) {
    commit("resetLikes");
	}
  },

  getters: {
    posts: (state) => state.posts
  }
});

const PostItem = {
  props: ["post"],
  template: `
    <article class="post">
      <header class="post-header">
        <div class="profile-icon">
          <img src="res/img/Profile.png" />
        </div>
        <span>{{ post.author || "Unknown" }}</span>
      </header>

      <div v-if="post.image" class="post-image">
        <img :src="post.image" :alt="post.title">
      </div>

      <div class="post-body">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
		
		    <div class="like-row">
          <button class="like-btn" @click="likePost">
            🖒
          </button>

          <span class="like-count">
            {{ post.likes }} likes
          </span>
      </div>
    </article>
  `
  ,

  methods: {
    likePost() {
      this.$store.dispatch("likePost", this.post.id);
    }
  }
};

const app = createApp({
  data() {
    return {
      dropdownOpen: false
    };
  },

  computed: {
    posts() {
      return this.$store.getters.posts;
    }
  },

  mounted() {
    this.$store.dispatch("fetchPosts");

    document.addEventListener("click", (e) => {
      const profile = document.querySelector(".profile-container");
      if (!profile.contains(e.target)) {
        this.dropdownOpen = false;
      }
    });
  },

  methods: {
    toggleDropdown() {
      this.dropdownOpen = !this.dropdownOpen;
    },
	  resetAllLikes() {
		  this.$store.dispatch("resetLikes");
	  }
  }
});

app.use(store);
app.component("post-item", PostItem);
app.mount("#app");
</script>
</body>
</html>
